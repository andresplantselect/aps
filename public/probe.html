<!doctype html>
<title>File Input Probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px system-ui, sans-serif; padding: 24px; background: #f5f5f0; }
  label.btn { display: inline-block; font-size: 18px; padding: 16px 24px; border-radius: 999px; border: none; background: #2f5233; color: white; cursor: pointer; }
  input[type=file] { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
  #log { margin-top: 24px; white-space: pre-wrap; background: white; padding: 12px; border-radius: 8px; font-size: 13px; }
  .ok { color: green; font-weight: bold; }
</style>
<h1>Probe</h1>
<p>Diagnostic page — no app code, just a plain file input. Tap the button, pick any photo, watch the log below.</p>
<label class="btn">
  Elegir foto
  <input id="file" type="file" accept="image/*">
</label>
<div id="log"></div>
<script>
  const log = document.getElementById('log');
  const loadedAt = new Date().toLocaleTimeString();
  const navType = performance.getEntriesByType('navigation')[0]?.type ?? 'unknown';
  log.textContent = `page loaded at ${loadedAt} (nav type: ${navType})\n`;

  document.getElementById('file').onchange = (e) => {
    const f = e.target.files[0];
    log.textContent += `onChange fired at ${new Date().toLocaleTimeString()}: ${f ? f.name + ' (' + Math.round(f.size/1024) + 'KB)' : 'no file'}\n`;
    log.innerHTML += '<span class="ok">SUCCESS — page survived and got the file.</span>';
  };
</script>
